name: build-iso
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Init pacman
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archiso git base-devel sudo reflector

      - name: Add CachyOS repos
        run: |
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman -U --noconfirm \
            'https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-keyring-20240331-1-any.pkg.tar.zst' \
            'https://mirror.cachyos.org/repo/x86_64/cachyos/cachyos-mirrorlist-27-1-any.pkg.tar.zst'
          printf '\n[cachyos]\nInclude = /etc/pacman.d/cachyos-mirrorlist\n' >> /etc/pacman.conf
          pacman -Sy

      - name: Add chaotic-aur for AUR binaries
        run: |
          pacman-key --recv-keys 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf
          pacman -Sy

      - name: Validate profile
        run: |
          ls -R profile airootfs scripts
          bash -n scripts/build.sh
          bash -n scripts/install.sh
          python3 -m py_compile airootfs/usr/local/bin/kzc-monitor
          echo "--- packages ---"
          cat profile/packages.x86_64
          echo "--- check repo availability ---"
          while read -r pkg; do
            case "$pkg" in ""|\#*) continue;; esac
            pacman -Si "$pkg" >/dev/null 2>&1 || echo "MISSING: $pkg"
          done < profile/packages.x86_64

      - name: Build lamX
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -lh out/

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lamX-iso
          path: out/*.iso

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lamX-build-logs
          path: work/
