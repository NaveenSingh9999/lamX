name: promote-release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Compress run ID holding the lamX-iso-zip artifact"
        required: true
        default: "34026784430"
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0"

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download ZIP artifact from compress run
        uses: actions/download-artifact@v4
        with:
          name: lamX-iso-zip
          path: ./release-zip
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -lh release-zip/
          (cd release-zip && sha256sum -c SHA256SUMS.txt)
          find release-zip -maxdepth 1 -name 'lamX-*.zip*' -print -quit | grep -q . || { echo "no ZIP asset"; exit 1; }
          find release-zip -maxdepth 1 -name 'lamX-*.zip*' -printf '%s %p\n' | awk '$1 > 1200000000 { oversize=1; print "oversize:", $0 } END { exit oversize }'

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: lamX ${{ inputs.tag }}
          body: |
            lamX ${{ inputs.tag }} — ultra-light CachyOS-based daily driver.

            ZIP-only release built from compress run ${{ inputs.run_id }}. Download every lamX-*.zip* part plus SHA256SUMS.txt, verify checksums, unzip/split-reassemble, then verify SOURCE_ISO_SHA256.txt before flashing. See README for exact commands.
          files: |
            release-zip/lamX-*.zip*
            release-zip/*.txt
          fail_on_unmatched_files: true
