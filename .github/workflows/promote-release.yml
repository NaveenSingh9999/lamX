name: promote-release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID holding the lamX-iso artifact"
        required: true
        default: "34026784430"
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0"

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: lamX-iso
          path: ./release-iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        run: |
          ls -lh release-iso/
          cd release-iso && sha256sum *.iso > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: lamX ${{ inputs.tag }}
          body: |
            lamX ${{ inputs.tag }} — ultra-light CachyOS-based daily driver.

            ISO built from run ${{ inputs.run_id }}. See README for full install commands.
            Verify with SHA256SUMS.txt after download.
          files: |
            release-iso/*.iso
            release-iso/SHA256SUMS.txt
          fail_on_unmatched_files: false
