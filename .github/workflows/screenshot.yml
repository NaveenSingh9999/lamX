name: screenshot
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID holding the lamX-iso artifact"
        required: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: lamX-iso
          path: ./iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86

      - name: Boot and photograph
        timeout-minutes: 25
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACC="-machine accel=kvm -cpu host"; else ACC="-accel tcg,thread=multi"; fi
          timeout 570 qemu-system-x86_64 $ACC -m 3072 -smp 2 \
            -cdrom iso/*.iso -boot order=d -vga virtio \
            -display none -serial file:serial.log \
            -qmp unix:qmp.sock,server=on,wait=off &
          python3 scripts/ci-shoot.py
          wait || true

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lamX-frames
          path: frames/
