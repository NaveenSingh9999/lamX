# hyprland optional session - super smooth animations, glassy match to sway theme
# default stays sway for battery. pick Hyprland at login for eye candy.
monitor = ,preferred,auto,1

exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprpaper
exec-once = swayidle -w timeout 60 'swaylock -f -c 0a0e1a' timeout 300 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'swaylock -f -c 0a0e1a'

input {
  kb_layout = us
  follow_mouse = 1
  touchpad { natural_scroll = yes, disable_while_typing = true }
}

general {
  gaps_in = 10
  gaps_out = 8
  border_size = 2
  col.active_border = rgba(3b82f6ee) rgba(60a5faee) 45deg
  col.inactive_border = rgba(1e293bcc)
  layout = dwindle
}

decoration {
  rounding = 12
  active_opacity = 1.0
  inactive_opacity = 0.97
  shadow { enabled = yes, range = 20, render_power = 3, color = rgba(00000099) }
  blur { enabled = yes, size = 6, passes = 2, brightness = 1.0, contrast = 1.0, vibrancy = 0.15 }
}

# best-practice smooth animations, moderate for laptop battery
animations {
  enabled = yes
  bezier = easeOut, 0.05, 0.9, 0.1, 1.05
  bezier = easeInOut, 0.65, 0, 0.35, 1
  animation = windows, 1, 4, easeOut
  animation = windowsOut, 1, 4, easeOut, popin 80%
  animation = border, 1, 8, easeOut
  animation = borderangle, 1, 30, easeInOut, loop
  animation = fade, 1, 5, easeOut
  animation = workspaces, 1, 5, easeOut, slide
}

dwindle { pseudotile = yes, preserve_split = yes }

$mod = SUPER
bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod SHIFT, Q, killactive,
bind = $mod SHIFT, E, exec, hyprctl dispatch exit
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mod, M, exec, foot -e lamx-music

windowrulev2 = opacity 0.92 0.92, class:^(foot)$
windowrulev2 = opacity 0.88 0.88, class:^(wofi)$
layerrule = blur, waybar
layerrule = blur, notifications
