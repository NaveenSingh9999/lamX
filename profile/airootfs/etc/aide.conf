# AIDE minimal - silent integrity base, checked weekly by timer
database=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
gzip_dbout=yes
report_url=file:/var/log/kzc/aide-report.txt
summarize_changes=yes

/bin R
/sbin R
/usr/bin R
/usr/sbin R
/usr/lib R
/etc R
/boot R
!/var/lib
!/proc
!/sys
!/dev
