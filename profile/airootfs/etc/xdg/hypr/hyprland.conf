# lamX hyprland hosts the caelestia shell, xfce stays second session
monitor = ,preferred,auto,1
$mainMod = SUPER
exec-once = waybar 2>/dev/null || true
exec-once = caelestia-shell 2>/dev/null || caelestia shell 2>/dev/null || qs -c caelestia 2>/dev/null || true
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = lamx-wallpaper
exec-once = kzc-greet
exec-once = swayidle -w timeout 600 'loginctl lock-session' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' 2>/dev/null || true
bind = $mainMod, Return, exec, foot
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exec, lamx-powermenu
bind = $mainMod, D, exec, lamx-spotlight
bind = $mainMod, M, exec, foot lamx-music
