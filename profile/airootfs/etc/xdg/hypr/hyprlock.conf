background {
  monitor =
  path = /usr/share/backgrounds/forest-day.png
  blur_passes = 3
  blur_size = 8
  vibrancy = 0.15
}
image {
  monitor =
  path = /usr/share/icons/lamX.png
  size = 140
  halign = center
  valign = center
  position = 0, 90
}
label {
  monitor =
  text = lamX
  font_family = IosevkaTerm Nerd Font
  font_size = 28
  halign = center
  valign = center
  position = 0, -40
}
label {
  monitor =
  text = $TIME
  font_family = IosevkaTerm Nerd Font
  font_size = 96
  halign = center
  valign = center
  position = 0, -180
}
input-field {
  monitor =
  size = 280, 48
  halign = center
  valign = center
  position = 0, -300
  outline_thickness = 2
  outer_color = rgb(59, 130, 246)
  inner_color = rgba(10, 14, 26, 0.6)
  font_color = rgb(229, 229, 229)
  placeholder_text = $PASSWORD
}
