# lamX pacman.conf - CachyOS generic x86_64 + Arch
# generic used for ISO build so CI runners without x86-64-v3 can build
# after install on target laptop, switch to v3/v4 via cachyos-repo.sh for speed
[options]
HoldPkg = pacman glibc
Architecture = x86_64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# CachyOS generic
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Arch
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
