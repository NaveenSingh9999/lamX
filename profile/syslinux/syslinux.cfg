DEFAULT arch64
UI menu.c32
PROMPT 0
TIMEOUT 50
MENU TITLE lamX
LABEL arch64
MENU LABEL lamX
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos-hardened
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet loglevel=3 systemd.show_status=auto preempt=full mem_sleep_default=deep lockdown=confidentiality slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 vsyscall=none debugfs=off mitigations=auto nowatchdog
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos-hardened.img
